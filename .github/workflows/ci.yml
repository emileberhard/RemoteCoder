name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reuse:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      gateway: ${{ steps.scope.outputs.gateway }}
      gateway-lint: ${{ steps.scope.outputs.gateway-lint }}
      swift: ${{ steps.scope.outputs.swift }}
      apps-ios: ${{ steps.scope.outputs.apps-ios }}
      apps-mac: ${{ steps.scope.outputs.apps-mac }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APP_SOURCES: RemoteCoder RemoteCoder.xcodeproj RemoteCoderCaptureExtension RemoteCoderLiveActivities RemoteCoderLocationPushService RemoteCoderNotificationService RemoteCoderShareExtension RemoteCoderTests RemoteCoderUITests Core Shared Config web-client
          GATEWAY_SOURCES: host-daemon-rs .cargo rust-toolchain.toml web-client agent-calls relay dev-tools docs AGENTS.md CLAUDE.md README.md CONTRIBUTING.md SECURITY.md PRIVACY.md
        run: |
          set -euo pipefail
          inputs() {
            git ls-tree HEAD | awk -F '\t' -v excluded="$1" 'BEGIN { split(excluded, names, " "); for (i in names) skip[names[i]] = 1 } !($2 in skip)' | sha256sum | cut -c1-40
          }
          gateway=$(inputs "$APP_SOURCES")
          apps=$(inputs "$GATEWAY_SOURCES")
          for lane in gateway:$gateway gateway-lint:$gateway swift:$(inputs '') apps-ios:$apps apps-mac:$apps; do
            name=ci-lane-${lane%%:*}-${lane#*:}
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=100" \
                --jq '[.artifacts[] | select((.expired | not) and .workflow_run.head_repository_id == .workflow_run.repository_id)] | length > 0' | grep -qx true; then
              echo "${lane%%:*} already passed on these inputs; reusing $name."
              name=reused
            fi
            printf '%s=%s\n' "${lane%%:*}" "$name" >> "$GITHUB_OUTPUT"
          done

  agent-calls:
    needs: reuse
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent-calls
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          python-version: '3.14'
      - name: Install the credential-source shell
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
      - run: uv run --locked ruff check agent_calls tests
      - run: uv run --locked ty check
      - run: uv run --locked pytest -q

  gateway:
    needs: reuse
    if: ${{ needs.reuse.outputs.gateway != 'reused' }}
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_INCREMENTAL: '0'
      RUST_TEST_THREADS: '4'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/select-xcode
      - name: Check native subprocess tools
        run: |
          /usr/bin/time -p /usr/bin/git --version
          /usr/bin/time -p /usr/bin/python3 -c 'import json, pathlib'
      - run: rustup show
      - name: Build the tests while tmux installs for the agent client tests
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          { brew list tmux >/dev/null 2>&1 || brew install tmux; } >"$RUNNER_TEMP/tmux.log" 2>&1 &
          tmux_install=$!
          cargo test --manifest-path host-daemon-rs/Cargo.toml --locked --no-run
          wait "$tmux_install" || { cat "$RUNNER_TEMP/tmux.log"; exit 1; }
      - run: cargo test --manifest-path host-daemon-rs/Cargo.toml --locked

  gateway-lint:
    needs: reuse
    if: ${{ needs.reuse.outputs.gateway-lint != 'reused' }}
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/select-xcode
      - run: rustup show
      - run: cargo fmt --manifest-path host-daemon-rs/Cargo.toml --check
      - run: cargo clippy --manifest-path host-daemon-rs/Cargo.toml --locked --all-targets --all-features -- -D warnings

  swift:
    needs: reuse
    if: ${{ needs.reuse.outputs.swift != 'reused' }}
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/select-xcode
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.59.0'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
      - run: python3 scripts/core-test.py
      - run: ./scripts/lint-glass
      - run: ./scripts/lint-haptics
      - run: ./scripts/lint-symbol-effects
      - run: ./scripts/lint-interface-scale
      - run: ./scripts/lint-platform-imports
      - run: uv run --project dev-tools --locked python -m unittest discover -s scripts/tests

  apps-ios:
    needs: reuse
    if: ${{ needs.reuse.outputs.apps-ios != 'reused' }}
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      RC_COMPILATION_OWNER: '1'
      RC_DERIVED_DATA: ${{ github.workspace }}/.local/app-build
      RC_BUILD_PROVENANCE: ${{ github.workspace }}/.local/ci/source.json
      RC_BUILD_STAGES: ${{ github.workspace }}/.local/ci/stages.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/select-xcode
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.59.0'
      - name: Record this CI build's source
        run: |
          mkdir -p "$(dirname "$RC_BUILD_PROVENANCE")"
          jq -n --arg commit "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            '{sourceCommit:$commit,buildId:$run}' > "$RC_BUILD_PROVENANCE"
      - run: just ios-build-local
      - name: Create and boot the baseline iPhone 17 Pro on iOS 27.0
        timeout-minutes: 5
        run: |
          device=$(xcrun simctl create 'RemoteCoder CI' \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro \
            com.apple.CoreSimulator.SimRuntime.iOS-27-0)
          echo "RC_IOS_SIMULATOR=$device" >> "$GITHUB_ENV"
          echo "Created the iPhone 17 Pro / iOS 27.0 baseline: $device"
          xcrun simctl bootstatus "$device" -b
      - run: just verify-simulator-local
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: failed-native-tests-ios-${{ github.run_attempt }}
          path: .local/ci
          retention-days: 1
          if-no-files-found: ignore

  apps-mac:
    needs: reuse
    if: ${{ needs.reuse.outputs.apps-mac != 'reused' }}
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      RC_COMPILATION_OWNER: '1'
      RC_DERIVED_DATA: ${{ github.workspace }}/.local/app-build
      RC_BUILD_PROVENANCE: ${{ github.workspace }}/.local/ci/source.json
      RC_BUILD_STAGES: ${{ github.workspace }}/.local/ci/stages.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/select-xcode
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.59.0'
      - name: Record this CI build's source
        run: |
          mkdir -p "$(dirname "$RC_BUILD_PROVENANCE")"
          jq -n --arg commit "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            '{sourceCommit:$commit,buildId:$run}' > "$RC_BUILD_PROVENANCE"
      - run: just mac-build-local
      - run: just mac-harness-build-local
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: failed-native-tests-mac-${{ github.run_attempt }}
          path: .local/ci
          retention-days: 1
          if-no-files-found: ignore

  web:
    needs: reuse
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
        working-directory: web-client
      - run: bun run typecheck
        working-directory: web-client
      - run: bun test
        working-directory: web-client
      - run: bun run build
        working-directory: web-client

  passed:
    needs: [reuse, agent-calls, gateway, gateway-lint, swift, apps-ios, apps-mac, web]
    if: ${{ always() && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TRUSTED: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Write the passed-lane marker
        if: always() && env.TRUSTED == 'true'
        run: printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/passed"
      - if: always() && env.TRUSTED == 'true' && needs.gateway.result == 'success' && startsWith(needs.reuse.outputs.gateway, 'ci-lane-')
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.reuse.outputs.gateway }}
          path: ${{ runner.temp }}/passed
          retention-days: 14
          overwrite: true
      - if: always() && env.TRUSTED == 'true' && needs.gateway-lint.result == 'success' && startsWith(needs.reuse.outputs.gateway-lint, 'ci-lane-')
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.reuse.outputs.gateway-lint }}
          path: ${{ runner.temp }}/passed
          retention-days: 14
          overwrite: true
      - if: always() && env.TRUSTED == 'true' && needs.swift.result == 'success' && startsWith(needs.reuse.outputs.swift, 'ci-lane-')
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.reuse.outputs.swift }}
          path: ${{ runner.temp }}/passed
          retention-days: 14
          overwrite: true
      - if: always() && env.TRUSTED == 'true' && needs.apps-ios.result == 'success' && startsWith(needs.reuse.outputs.apps-ios, 'ci-lane-')
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.reuse.outputs.apps-ios }}
          path: ${{ runner.temp }}/passed
          retention-days: 14
          overwrite: true
      - if: always() && env.TRUSTED == 'true' && needs.apps-mac.result == 'success' && startsWith(needs.reuse.outputs.apps-mac, 'ci-lane-')
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.reuse.outputs.apps-mac }}
          path: ${{ runner.temp }}/passed
          retention-days: 14
          overwrite: true
      - name: Require every lane to pass or reuse a pass
        if: always()
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e '.reuse.outputs as $reused | .reuse.result == "success" and all(to_entries[] | select(.key != "reuse"); .value.result == "success" or (.value.result == "skipped" and $reused[.key] == "reused"))' <<< "$RESULTS"
