name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reuse:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.scope.outputs.run }}
      tree: ${{ steps.scope.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          run=true
          tree=$(git rev-parse 'HEAD^{tree}')
          if [[ "$EVENT_NAME" == push ]] && gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ci-passed-$tree&per_page=100" \
              --jq '[.artifacts[] | select((.expired | not) and .workflow_run.head_repository_id == .workflow_run.repository_id)] | length > 0' | grep -qx true; then
            run=false
            echo "A pull request already passed every lane on tree $tree; reusing that result."
          fi
          printf 'run=%s\ntree=%s\n' "$run" "$tree" >> "$GITHUB_OUTPUT"

  agent-calls:
    needs: reuse
    if: ${{ needs.reuse.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent-calls
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.4'
          python-version: '3.14'
      - name: Install the credential-source shell
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
      - run: uv run --locked ruff check agent_calls tests
      - run: uv run --locked ty check
      - run: uv run --locked pytest -q

  gateway:
    needs: reuse
    if: ${{ needs.reuse.outputs.run == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '4'
      RUST_TEST_THREADS: '4'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/select-xcode
      - name: Check native subprocess tools
        run: |
          /usr/bin/time -p /usr/bin/git --version
          /usr/bin/time -p /usr/bin/python3 -c 'import json, pathlib'
      - name: Install tmux for the agent client tests
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew list tmux >/dev/null 2>&1 || brew install tmux
      - run: rustup show
      - run: cargo test --manifest-path host-daemon-rs/Cargo.toml --locked

  gateway-lint:
    needs: reuse
    if: ${{ needs.reuse.outputs.run == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/select-xcode
      - run: rustup show
      - run: cargo fmt --manifest-path host-daemon-rs/Cargo.toml --check
      - run: cargo clippy --manifest-path host-daemon-rs/Cargo.toml --locked --all-targets --all-features -- -D warnings

  swift:
    needs: reuse
    if: ${{ needs.reuse.outputs.run == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/select-xcode
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.59.0'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.4'
      - run: python3 scripts/core-test.py
      - run: ./scripts/lint-glass
      - run: ./scripts/lint-haptics
      - run: ./scripts/lint-symbol-effects
      - run: ./scripts/lint-interface-scale
      - run: ./scripts/lint-platform-imports
      - run: uv run --project dev-tools --locked python -m unittest discover -s scripts/tests

  apps-ios:
    needs: reuse
    if: ${{ needs.reuse.outputs.run == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      RC_COMPILATION_OWNER: '1'
      RC_DERIVED_DATA: ${{ github.workspace }}/.local/app-build
      RC_BUILD_PROVENANCE: ${{ github.workspace }}/.local/ci/source.json
      RC_BUILD_STAGES: ${{ github.workspace }}/.local/ci/stages.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/select-xcode
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.59.0'
      - name: Record this CI build's source
        run: |
          mkdir -p "$(dirname "$RC_BUILD_PROVENANCE")"
          jq -n --arg commit "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            '{sourceCommit:$commit,buildId:$run}' > "$RC_BUILD_PROVENANCE"
      - name: Create and start booting the baseline iPhone 17 Pro on iOS 27.0
        timeout-minutes: 5
        run: |
          device=$(xcrun simctl create 'RemoteCoder CI' \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro \
            com.apple.CoreSimulator.SimRuntime.iOS-27-0)
          echo "RC_IOS_SIMULATOR=$device" >> "$GITHUB_ENV"
          echo "Created the iPhone 17 Pro / iOS 27.0 baseline: $device"
          xcrun simctl boot "$device"
      - run: just ios-build-local
      - name: Wait for the baseline simulator to finish booting
        timeout-minutes: 5
        run: xcrun simctl bootstatus "$RC_IOS_SIMULATOR" -b
      - run: just verify-simulator-local
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: failed-native-tests-ios-${{ github.run_attempt }}
          path: .local/ci
          retention-days: 1
          if-no-files-found: ignore

  apps-mac:
    needs: reuse
    if: ${{ needs.reuse.outputs.run == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      RC_COMPILATION_OWNER: '1'
      RC_DERIVED_DATA: ${{ github.workspace }}/.local/app-build
      RC_BUILD_PROVENANCE: ${{ github.workspace }}/.local/ci/source.json
      RC_BUILD_STAGES: ${{ github.workspace }}/.local/ci/stages.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/select-xcode
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.59.0'
      - name: Record this CI build's source
        run: |
          mkdir -p "$(dirname "$RC_BUILD_PROVENANCE")"
          jq -n --arg commit "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            '{sourceCommit:$commit,buildId:$run}' > "$RC_BUILD_PROVENANCE"
      - run: just mac-build-local
      - run: just mac-harness-build-local
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: failed-native-tests-mac-${{ github.run_attempt }}
          path: .local/ci
          retention-days: 1
          if-no-files-found: ignore

  web:
    needs: reuse
    if: ${{ needs.reuse.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
        working-directory: web-client
      - run: bun run typecheck
        working-directory: web-client
      - run: bun test
        working-directory: web-client
      - run: bun run build
        working-directory: web-client

  passed:
    needs: [reuse, agent-calls, gateway, gateway-lint, swift, apps-ios, apps-mac, web]
    if: ${{ always() && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TREE: ${{ needs.reuse.outputs.tree }}
      RECORD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Require every lane that ran to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$RESULTS"
      - name: Record the fully tested tree
        id: record
        if: env.RECORD == 'true' && env.TREE != ''
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success")' <<< "$RESULTS" || exit 0
          mkdir -p "$RUNNER_TEMP/passed"
          printf '%s\n' "$TREE" > "$RUNNER_TEMP/passed/tree"
          echo "full=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.record.outputs.full == 'true'
        with:
          name: ci-passed-${{ env.TREE }}
          path: ${{ runner.temp }}/passed/tree
          retention-days: 14
          overwrite: true
