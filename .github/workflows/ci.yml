name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    if: ${{ !github.event.repository.private }}
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.0.app/Contents/Developer
      CARGO_BUILD_JOBS: '4'
      RUST_TEST_THREADS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo fmt --manifest-path host-daemon-rs/Cargo.toml --check
      - run: cargo clippy --manifest-path host-daemon-rs/Cargo.toml --locked --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path host-daemon-rs/Cargo.toml --locked

  swift:
    if: ${{ !github.event.repository.private }}
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/core-test.py
      - run: ./scripts/lint-glass
      - run: ./scripts/lint-haptics
      - run: ./scripts/lint-symbol-effects
      - run: ./scripts/lint-interface-scale
      - run: ./scripts/lint-platform-imports

  web:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
        working-directory: web-client
      - run: bun run typecheck
        working-directory: web-client
      - run: bun test
        working-directory: web-client
      - run: bun run build
        working-directory: web-client
      - run: python3 -m unittest discover -s scripts/tests -p test_release_tag.py
