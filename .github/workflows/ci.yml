name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      gateway: ${{ steps.scope.outputs.gateway }}
      swift: ${{ steps.scope.outputs.swift }}
      agent_calls: ${{ steps.scope.outputs.agent_calls }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name == 'pull_request' }}
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gateway=false
          swift=false
          agent_calls=false
          if [[ "$EVENT_NAME" == push ]]; then
            gateway=true
            swift=true
            agent_calls=true
          else
            git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                host-daemon-rs/*|docs/codex/compatibility.json|protocol-fixtures/*|dev-tools/fixtures/*|rust-toolchain.toml|.github/workflows/ci.yml) gateway=true ;;
              esac
              case "$path" in
                *.swift|protocol-fixtures/*|Core/*|RemoteCoder/*|RemoteCoderMac/*|RemoteCoderTests/*|RemoteCoderUITests/*|RemoteCoderLiveActivities/*|RemoteCoderNotificationService/*|RemoteCoderLocationPushService/*|RemoteCoderShareExtension/*|RemoteCoderCaptureExtension/*|Shared/*|Config/*|RemoteCoder.xcodeproj/*|scripts/*|.xcode-version|.swift-version|.github/workflows/ci.yml) swift=true ;;
              esac
              case "$path" in
                agent-calls/*|dev-tools/*|.github/workflows/ci.yml) agent_calls=true ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
          fi
          printf 'gateway=%s\nswift=%s\nagent_calls=%s\n' "$gateway" "$swift" "$agent_calls" >> "$GITHUB_OUTPUT"

  agent-calls:
    needs: changes
    if: ${{ needs.changes.outputs.agent_calls == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent-calls
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.4'
          python-version: '3.14'
      - name: Install the credential-source shell
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
      - run: uv run --locked ruff check agent_calls tests
      - run: uv run --locked ty check
      - run: uv run --locked pytest -q

  gateway:
    needs: changes
    if: ${{ needs.changes.outputs.gateway == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '4'
      RUST_TEST_THREADS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/select-xcode
      - name: Check native subprocess tools
        run: |
          /usr/bin/time -p /usr/bin/git --version
          /usr/bin/time -p /usr/bin/python3 -c 'import json, pathlib'
      - name: Install tmux for the agent client tests
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew list tmux >/dev/null 2>&1 || brew install tmux
      - run: rustup show
      - run: cargo fmt --manifest-path host-daemon-rs/Cargo.toml --check
      - run: cargo clippy --manifest-path host-daemon-rs/Cargo.toml --locked --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path host-daemon-rs/Cargo.toml --locked

  swift:
    needs: changes
    if: ${{ needs.changes.outputs.swift == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/select-xcode
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: '1.59.0'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.4'
      - run: python3 scripts/core-test.py
      - run: ./scripts/lint-glass
      - run: ./scripts/lint-haptics
      - run: ./scripts/lint-symbol-effects
      - run: ./scripts/lint-interface-scale
      - run: ./scripts/lint-platform-imports
      - run: uv run --project dev-tools --locked python -m unittest discover -s scripts/tests

  apps:
    needs: changes
    if: ${{ needs.changes.outputs.swift == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      RC_COMPILATION_OWNER: '1'
      RC_DERIVED_DATA: ${{ github.workspace }}/.local/app-build
      RC_BUILD_PROVENANCE: ${{ github.workspace }}/.local/ci/source.json
      RC_BUILD_STAGES: ${{ github.workspace }}/.local/ci/stages.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/select-xcode
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: '1.59.0'
      - name: Record this CI build's source
        run: |
          mkdir -p "$(dirname "$RC_BUILD_PROVENANCE")"
          jq -n --arg commit "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            '{sourceCommit:$commit,buildId:$run}' > "$RC_BUILD_PROVENANCE"
      - run: just ios-build-local
      - run: just mac-build-local
      - run: just mac-harness-build-local
      - name: Create the baseline iPhone 17 Pro on iOS 27.0
        timeout-minutes: 5
        run: |
          device=$(xcrun simctl create 'RemoteCoder CI' \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro \
            com.apple.CoreSimulator.SimRuntime.iOS-27-0)
          echo "RC_IOS_SIMULATOR=$device" >> "$GITHUB_ENV"
          echo "Created the iPhone 17 Pro / iOS 27.0 baseline: $device"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
      - run: just verify-simulator-local
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: failed-native-tests-${{ github.run_attempt }}
          path: .local/ci
          retention-days: 1
          if-no-files-found: ignore

  web:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
        working-directory: web-client
      - run: bun run typecheck
        working-directory: web-client
      - run: bun test
        working-directory: web-client
      - run: bun run build
        working-directory: web-client
