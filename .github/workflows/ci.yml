name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      gateway: ${{ steps.scope.outputs.gateway }}
      swift: ${{ steps.scope.outputs.swift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name == 'pull_request' }}
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gateway=false
          swift=false
          if [[ "$EVENT_NAME" == push ]]; then
            gateway=true
            swift=true
          else
            git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                host-daemon-rs/*|docs/codex/compatibility.json|protocol-fixtures/*|dev-tools/fixtures/*|rust-toolchain.toml|.github/workflows/ci.yml) gateway=true ;;
              esac
              case "$path" in
                *.swift|protocol-fixtures/*|Core/*|RemoteCoder/*|RemoteCoderMac/*|RemoteCoderTests/*|RemoteCoderUITests/*|RemoteCoderLiveActivities/*|RemoteCoderNotificationService/*|RemoteCoderLocationPushService/*|RemoteCoderShareExtension/*|RemoteCoderCaptureExtension/*|Shared/*|Config/*|RemoteCoder.xcodeproj/*|scripts/*|.xcode-version|.swift-version|.github/workflows/ci.yml) swift=true ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
          fi
          printf 'gateway=%s\nswift=%s\n' "$gateway" "$swift" >> "$GITHUB_OUTPUT"

  gateway:
    needs: changes
    if: ${{ needs.changes.outputs.gateway == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '4'
      RUST_TEST_THREADS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check native subprocess tools
        run: |
          /usr/bin/time -p /usr/bin/git --version
          /usr/bin/time -p /usr/bin/python3 -c 'import json, pathlib'
      - run: scripts/select-xcode
      - run: rustup show
      - run: cargo fmt --manifest-path host-daemon-rs/Cargo.toml --check
      - run: cargo clippy --manifest-path host-daemon-rs/Cargo.toml --locked --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path host-daemon-rs/Cargo.toml --locked

  swift:
    needs: changes
    if: ${{ needs.changes.outputs.swift == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/select-xcode
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: '1.59.0'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.4'
      - run: python3 scripts/core-test.py
      - run: ./scripts/lint-glass
      - run: ./scripts/lint-haptics
      - run: ./scripts/lint-symbol-effects
      - run: ./scripts/lint-interface-scale
      - run: ./scripts/lint-platform-imports
      - run: uv run --project dev-tools --locked python -m unittest discover -s scripts/tests

  apps:
    needs: changes
    if: ${{ needs.changes.outputs.swift == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      RC_COMPILATION_OWNER: '1'
      RC_DERIVED_DATA: ${{ github.workspace }}/.local/app-build
      RC_IOS_SIMULATOR: iPhone 17 Pro
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/select-xcode
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: '1.59.0'
      - run: just ios-build-local
      - run: just mac-build-local
      - run: just mac-harness-build-local
      - run: just verify-simulator-local

  web:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
        working-directory: web-client
      - run: bun run typecheck
        working-directory: web-client
      - run: bun test
        working-directory: web-client
      - run: bun run build
        working-directory: web-client
