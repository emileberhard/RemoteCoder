version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 1
    groups:
      dependencies:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /host-daemon-rs
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 1
    groups:
      dependencies:
        patterns: ['*']
  - package-ecosystem: bun
    directory: /web-client
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 1
    groups:
      dependencies:
        patterns: ['*']
  - package-ecosystem: uv
    directory: /dev-tools
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 1
    groups:
      dependencies:
        patterns: ['*']
  - package-ecosystem: uv
    directory: /agent-calls
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 1
    groups:
      dependencies:
        patterns: ['*']
