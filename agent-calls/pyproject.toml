[project]
name = "remotecoder-agent-calls"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "aiortc>=1.14,<2",
  "httpx>=0.28,<0.29",
  "pydantic>=2.14.1,<3",
  "remotecoder-tools",
  "websockets>=17.3,<18",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_calls"]

[tool.uv.sources]
remotecoder-tools = { path = "../dev-tools", editable = true }

[dependency-groups]
worker-build = ["hatchling==1.32.4", "editables==0.6"]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.17.1", "ty>=0.0.90"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
