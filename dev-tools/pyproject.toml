[project]
name = "remotecoder-tools"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "cryptography==50.0.2",
  "httpx==0.28.1",
  "websockets>=15,<18",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12", "ty>=0.0.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
exclude-newer = "12 hours"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
