global
    log /dev/log local0 notice
    maxconn 512
    ssl-default-bind-options ssl-min-ver TLSv1.3

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout client-fin 10s
    timeout server-fin 10s

frontend relay
    bind :443 ssl crt /etc/haproxy/relay.pem alpn http/1.1
    bind :::443 v6only ssl crt /etc/haproxy/relay.pem alpn http/1.1
    tcp-request inspect-delay 5s
    tcp-request content reject unless { req.payload(0,8) -m str "CONNECT " }
    default_backend tinyproxy

backend tinyproxy
    server tinyproxy 127.0.0.1:8888
